[project]
name = "risk-orchestrator"
version = "0.1.0"
description = "RiskFlow Orchestrator — Система бесконфликтной оркестрации параллельных процессов оценки рисков"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "customtkinter>=5.2.2",
    "matplotlib>=3.9.0",
    "async-tkinter-loop>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "services", "ui", "scripts"]

[tool.ruff]
line-length = 108
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
